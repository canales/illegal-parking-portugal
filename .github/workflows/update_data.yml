name: Update parking data

# Runs every Monday at 06:00 UTC
# Can also be triggered manually from the Actions tab
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Never run two updates at once (for example a manual run started while the Monday run is still going)
concurrency:
  group: update-parking-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Install Python dependencies
        run: |
          pip install pyrosm geopandas shapely pandas pyogrio

      - name: Fetch latest infraction data from API
        run: python scripts/fetch_data.py

      # Imbecis steps never block the Denúncia update: if one fails, the Denúncia data is still
      # committed below, and the run is marked as failed at the very end so it does not go unnoticed.
      # (scripts/fetch_imbecis.py exits non-zero when the Imbecis API cannot be read, which is what makes this work.)
      - name: Fetch latest Imbecis reports
        id: imbecis
        continue-on-error: true
        run: python scripts/fetch_imbecis.py

      - name: Show what the Imbecis file contains
        if: steps.imbecis.outcome == 'success'
        run: |
          python - <<'EOF'
          import json, os
          path = 'data/infractions_imbecis.geojson'
          if not os.path.exists(path):
              print(f'WARNING: fetch_imbecis.py finished but {path} does not exist')
          else:
              feats = json.load(open(path, encoding='utf-8'))['features']
              dates = sorted((f['properties'].get('occurredAt') or f['properties'].get('data_data') or '')[:10] for f in feats)
              print(f'Imbecis: {len(feats)} reports, latest {dates[-1] if dates else "none"}')
          EOF

      - name: Download Portugal OSM extract
        run: |
          curl -L --retry 3 -f -o data/portugal-latest.osm.pbf \
            "https://download.geofabrik.de/europe/portugal-latest.osm.pbf" \
          || curl -L --retry 3 -f -o data/portugal-latest.osm.pbf \
            "https://download.openstreetmap.fr/extracts/europe/portugal-latest.osm.pbf"
          ls -lh data/portugal-latest.osm.pbf

      - name: Run street matching
        run: python scripts/street_match.py --pbf data/portugal-latest.osm.pbf

      - name: Run street matching for Imbecis
        id: imbecis_streets
        if: steps.imbecis.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/street_match.py --pbf data/portugal-latest.osm.pbf \
            --input data/infractions_imbecis.geojson \
            --output data/streets_imbecis.geojson

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/infractions.geojson data/streets_matched.geojson data/road_network_lengths.json \
                   data/infractions_imbecis.geojson data/streets_imbecis.geojson; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: weekly data update $(date -u '+%Y-%m-%d')"
          # This job runs for a long time, so someone may have pushed to main in the meantime. Put our data
          # commit on top of whatever arrived (if both touched the same data file, our fresh data wins) and retry.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push the updated data after 3 attempts"
          exit 1

      - name: Mark the run as failed if an Imbecis step failed
        if: steps.imbecis.outcome == 'failure' || steps.imbecis_streets.outcome == 'failure'
        run: |
          echo "::error::An Imbecis step failed (fetch: ${{ steps.imbecis.outcome }}, street matching: ${{ steps.imbecis_streets.outcome }}). The Denúncia data was updated, but the Imbecis data was not."
          exit 1
