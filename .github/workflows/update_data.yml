name: Update parking data

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h cap — first run needs ~90min, cache runs ~10min

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install osmnx==2.0.1 geopandas shapely pandas pyogrio

      # Cache key uses a hardcoded month expression evaluated at job start.
      # save-always: true ensures the cache is saved even if later steps fail
      # or the job times out — so progress is never lost between runs.
      - name: Cache OSM network files
        uses: actions/cache@v4
        with:
          path: data/osm_cache
          key: osm-cache-${{ runner.os }}-${{ hashFiles('data/osm_cache/**') }}
          restore-keys: |
            osm-cache-${{ runner.os }}-
          save-always: true

      - name: Fetch latest infraction data from API
        run: python scripts/fetch_data.py

      - name: Run street matching (grid, with cache)
        run: python scripts/street_match.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/infractions.geojson data/streets_matched.geojson
          git diff --staged --quiet || git commit -m "chore: weekly data update $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
