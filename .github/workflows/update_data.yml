name: Update parking data

# Runs every Monday at 06:00 UTC
# Can also be triggered manually from the Actions tab
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install osmnx==2.0.1 geopandas scipy shapely numpy pandas

      - name: Fetch latest infraction data from API
        run: python scripts/fetch_data.py

      - name: Run street matching
        run: python scripts/street_match.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/infractions.geojson data/streets_matched.geojson
          git diff --staged --quiet || git commit -m "chore: weekly data update $(date -u '+%Y-%m-%d')"
          git push
