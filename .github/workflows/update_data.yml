name: Update parking data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install osmnx==2.0.1 geopandas shapely pandas pyogrio

      # RESTORE — load cached OSM network files if they exist
      - name: Restore OSM cache
        id: osm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/osm_cache
          key: osm-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            osm-cache-${{ runner.os }}-

      - name: Fetch latest infraction data from API
        run: python scripts/fetch_data.py

      - name: Fetch POI data from Overpass API
        run: python scripts/fetch_pois.py

      - name: Run street matching (grid, with cache)
        run: python scripts/street_match.py

      # SAVE — always save the cache after the run, even if street_match failed
      - name: Save OSM cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/osm_cache
          key: osm-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/infractions.geojson data/streets_matched.geojson data/stats.json data/road_network_lengths.json data/pois.geojson
          git diff --staged --quiet || git commit -m "chore: weekly data update $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
