name: Update parking data

# Runs every Monday at 06:00 UTC
# Also runs manually from the Actions tab (useful for first run)
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:       # ← allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install pyrosm geopandas scipy shapely

      # 4. Fetch latest infraction data from API
      - name: Fetch data from API
        run: python scripts/fetch_data.py

      # 5. Run street matching (full Portugal)
      #    PBF is downloaded fresh each run (~400MB, takes ~5 min)
      #    If you want to cache it between runs, see the commented step below
      - name: Run street matching
        run: python scripts/street_match.py

      # 6. Commit and push updated GeoJSONs back to the repo
      #    GitHub Pages will automatically serve the new files
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/infractions.geojson data/streets_matched.geojson
          git diff --staged --quiet || git commit -m "chore: weekly data update $(date -u '+%Y-%m-%d')"
          git push

